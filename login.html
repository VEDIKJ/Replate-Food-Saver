<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Log In - Replate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <a class="logo" href="index.html">replate</a>
  <div class="box">
    <h1>Welcome Back</h1>
    <p class="subtitle">Log in to your account</p>

    <!-- Real authentication: email + password are checked by the backend,
         and the account's registered role decides which dashboard opens. -->
    <form id="loginForm" novalidate>
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email">

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Your password" autocomplete="current-password">

      <button type="submit" id="loginBtn">Log In</button>
    </form>

    <p id="error" class="form-msg" style="display:none;"></p>

    <p>Don't have an account? <a href="register.html">Register here</a></p>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('error');
    const loginBtn = document.getElementById('loginBtn');

    function showError(message) {
      errorBox.textContent = message;
      errorBox.className = 'form-msg bad';
      errorBox.style.display = 'block';
    }

    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      errorBox.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showError('Please enter your email and password.');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in…';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password })
        });
        const data = await response.json();

        if (!response.ok) {
          showError(data.error || 'Could not log in.');
          loginBtn.disabled = false;
          loginBtn.textContent = 'Log In';
          return;
        }

        // The backend tells us where to go based on the registered role.
        window.location.href = data.redirect || 'customer.html';
      } catch (e) {
        showError('Could not reach the server. Is it running?');
        loginBtn.disabled = false;
        loginBtn.textContent = 'Log In';
      }
    });
  </script>
</body>
</html>
